name: Daily Slack Threads

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  send-threads:
    runs-on: ubuntu-latest
    steps:
      - name: Install Slack SDK
        run: npm install @slack/web-api

      - name: Send partner threads
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: |
          node --input-type=module << 'EOF'
          import pkg from '@slack/web-api';
          const { WebClient } = pkg;
          const web = new WebClient(process.env.SLACK_BOT_TOKEN);
          const partners = [
            'Soft2Bet', 'Cheddr', 'Mahadev', 'SBOBet',
            'Onyxcrown', 'UFA', 'Touchvas', 'Sportsbull', 'Betafric', 'Mossbets', '9ubet', 'Stakemate', 'Hakibets',
            'RWB2', 'RWB1', 'V33-1', 'Song88'
          ];
          const now = new Date();
          const day = String(now.getDate()).padStart(2, '0');
          const month = String(now.getMonth() + 1).padStart(2, '0');
          const date = day + '.' + month;
          for (const p of partners) {
            await web.chat.postMessage({ channel: process.env.CHANNEL_ID, text: p + ' (' + date + ')' });
            console.log('Posted:', p);
          }
          console.log('Done.');
          EOF