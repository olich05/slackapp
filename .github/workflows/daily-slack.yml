name: Daily Slack Threads

on:
  schedule:
    - cron: "00 1 * * *"
  workflow_dispatch:

jobs:
  send-threads:
    runs-on: ubuntu-latest
    steps:
      - name: Install Slack SDK
        run: npm install @slack/web-api

      - name: Send partner threads
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: |
          node --input-type=module << 'EOF'
          import pkg from '@slack/web-api';
          const { WebClient } = pkg;
          const web = new WebClient(process.env.SLACK_BOT_TOKEN);
          const teams = [
            { name: 'D1', partners: ['Stake', 'Soft2Bet', 'Cheddr', 'Mahadev', 'SBOBet'] },
            { name: 'D2', partners: ['Onyxcrown', 'UFA', 'Touchvas', 'Sportsbull', 'Betafric', 'Mossbets', '9ubet', 'Stakemate', 'Hakibets'] },
            { name: 'D3', partners: ['RWB2', 'RWB1', 'V33-1', 'Song88'] }
          ];
          const now = new Date();
          const day = String(now.getDate()).padStart(2, '0');
          const month = String(now.getMonth() + 1).padStart(2, '0');
          const date = day + '.' + month;
          for (const team of teams) {
            const teamMsg = await web.chat.postMessage({ channel: process.env.CHANNEL_ID, text: team.name });
            console.log('Posted team:', team.name);
            for (const p of team.partners) {
              await web.chat.postMessage({ channel: process.env.CHANNEL_ID, thread_ts: teamMsg.ts, text: p + ' (' + date + ')' });
              console.log('Posted:', p, 'under', team.name);
            }
          }
          console.log('Done.');
          EOF